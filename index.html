  { id: 'blgm', name: 'BLGM Manpower Services', role: 'agency', agency: 'BLGM Manpower Services' },

if (!db.acc) db.acc = [];
OFFICIAL_SYSTEM_ACCOUNTS.forEach(acc => {

[['blgm','BLGM Manpower Services'],['omni','Omnichron Security Agency, Inc']].forEach(a=>{if(!db.acc.some(x=>x.id===a[0]))db.acc.push({id:a[0],name:a[1],role:'agency',agency:a[1]})});sv();
db.emp.forEach(x=>['department','onboardDepartment'].forEach(k=>{if(x[k]==='PLI')x[k]='Quality'}));db.acc.forEach(a=>{if(a.dept==='PLI')a.dept='Quality'});[db.req,db.reqO].forEach(o=>{if(o&&o.PLI!==undefined){o.Quality=o.PLI;delete o.PLI}});if(db.man2&&db.man2.PLI){db.man2.Quality=db.man2.PLI;delete db.man2.PLI}sv();
async function hp(id,pw){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('ems:'+id+':'+pw));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return btoa(unescape(encodeURIComponent('ems:'+id+':'+pw)))}}

let user=null,page='A',cur=newEmp(),mAg='',mTab='All',mQ='';

function ensureSystemAccounts() {
  if (typeof db === 'undefined' || !db) return;
  if (!db.acc || !Array.isArray(db.acc)) db.acc = [];
  if (typeof OFFICIAL_SYSTEM_ACCOUNTS !== 'undefined') {
    OFFICIAL_SYSTEM_ACCOUNTS.forEach(acc => {
      const existing = db.acc.find(x => x.id && x.id.toLowerCase() === acc.id.toLowerCase());
      if (!existing) {
        db.acc.push(Object.assign({}, acc));
      } else {
        existing.name = acc.name;
        existing.role = acc.role;
        if (acc.dept !== undefined) existing.dept = acc.dept;
        if (acc.agency !== undefined) existing.agency = acc.agency;
      }
    });
  }
}

async function login(){ ensureSystemAccounts();
const id=$('lu').value.trim().toLowerCase(),p=$('lp').value,a=db.acc.find(x=>x.id.toLowerCase()===id);
 if(!a){$('le').textContent='Unknown ID. Please select one of the official roles below.';return}
 
 // Pre-seeded password check
 const defPass = DEFAULT_EMS_PASSWORDS[a.id];
 const enteredHash = await hp(a.id, p);

 const isDefMatch = (defPass && p === defPass) || (typeof LEGACY_EMS_PASSWORDS !== 'undefined' && LEGACY_EMS_PASSWORDS[a.id] && p === LEGACY_EMS_PASSWORDS[a.id]);

 if (!db.pw[a.id]) {
   if (isDefMatch) {
     db.pw[a.id] = enteredHash;
     sv();
   } else if (a.id === 'admin') {
     $('lc').hidden = false;
     if (p.length < 6 || p !== $('lc2').value) {
       $('le').textContent = 'Create a password (6+ characters) and confirm it below.';
       return;
     }
     db.pw[a.id] = enteredHash;
     sv();
   } else {
     $('le').textContent = 'Incorrect password.';
     return;
   }
 } else {
   if (db.pw[a.id] !== enteredHash) {
     if (isDefMatch) {
       db.pw[a.id] = enteredHash;
       sv();
     } else {
       $('le').textContent = 'Incorrect password.';
       return;
     }
   }
 }
 
  const rem = $('lrem') && $('lrem').checked;
  saveUserPassword(id, p, rem);
  user=a;$('le').textContent='';$('lp').value='';$('login').hidden=true;$('app').hidden=false;$('who').textContent=a.name+' ('+ROLES[a.role]+')';
 $('nav').innerHTML=[...PERM[a.role]].map(k=>`<button data-p="${k}" onclick="setPage('${k}')">${TT[k]}</button>`).join('');cur=newEmp();setPage(PERM[a.role][a.role==='depthead'||a.role==='om'?0:0])}

}}

const PSGC='https://psgc.gitlab.io/api',NCR_CODE='130000000',_pc={};
const pj=u=>_pc[u]||(_pc[u]=fetch(PSGC+u).then(r=>{if(!r.ok)throw 0;return r.json()}).catch(e=>{delete _pc[u];throw e}));
const nm=x=>String(x||'').toLowerCase().replace(/[^a-z0-9]/g,'');

async function provCode(name){if(nm(name).startsWith('metromanila'))return{ncr:1};const l=await pj('/provinces.json');const n=nm(name);const f=l.find(x=>nm(x.name)===n)||l.find(x=>nm(x.name).includes(n)||n.includes(nm(x.name)));if(!f)throw 0;return{code:f.code}}
async function towns(prov){const c=await provCode(prov);const l=await pj(c.ncr?'/regions/'+NCR_CODE+'/cities-municipalities.json':'/provinces/'+c.code+'/cities-municipalities.json');return l.map(x=>({code:x.code,name:x.name})).sort((a,b)=>a.name.localeCompare(b.name))}
async function brgys(prov,town){const l=await towns(prov);const t=l.find(x=>nm(x.name)===nm(town));if(!t)throw 0;const b=await pj('/cities-municipalities/'+t.code+'/barangays.json');return b.map(x=>x.name).sort((a,b)=>a.localeCompare(b))}
function setOpts(k,list,val,ph){let e=document.querySelector('#content [data-k='+k+']');if(!e)return;if(e.tagName!=='SELECT'){const s=document.createElement('select');s.dataset.k=k;e.replaceWith(s);e=s}

function toText(k,val){const e=document.querySelector('#content [data-k='+k+']');if(!e||e.tagName==='INPUT')return;const i=document.createElement('input');i.type='text';i.dataset.k=k;i.value=val||'';i.placeholder='Type here (list unavailable offline)';e.replaceWith(i)}
async function fillAddr(p,v){const C=p+'City',B=p+'Barangay';
 if(!v.prov){setOpts(C,[],'','Select province first');setOpts(B,[],'','Select town first');return}
 let tl=null;
 if(!v.skipTown){setOpts(C,[],v.city,'Loading...');setOpts(B,[],v.brgy,'Select town first');
  try{tl=(await towns(v.prov)).map(x=>x.name)}catch(e){toText(C,v.city);toText(B,v.brgy);return}
  if(gv(p+'Province')!==v.prov)return;
  const hit=tl.find(x=>nm(x)===nm(v.city));if(hit)v.city=hit;setOpts(C,tl,v.city,'Select');}
 if(!v.city){setOpts(B,[],'','Select town first');return}
 setOpts(B,[],v.brgy,'Loading...');
 try{const bl=await brgys(v.prov,v.city);if(gv(C)!==v.city)return;setOpts(B,bl,v.brgy,'Select')}catch(e){toText(B,v.brgy)}}

function handle2x2Upload(inp){
  const f = inp.files && inp.files[0];
  if(!f) return;
  if(f.size > 8 * 1024 * 1024){
    toast('Masyadong malaki ang picture (maximum 8MB)');
    inp.value = '';
    return;
  }
  const reader = new FileReader();
  reader.onload = function(e){
    const img = new Image();
    img.onload = function(){
      const canvas = document.createElement('canvas');
      const maxDim = 400;
      let w = img.width, h = img.height;
      const size = Math.min(w, h);
      const sx = (w - size) / 2;
      const sy = (h - size) / 2;
      canvas.width = maxDim;
      canvas.height = maxDim;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, sx, sy, size, size, 0, 0, maxDim, maxDim);
      cur.photo = canvas.toDataURL('image/jpeg', 0.86);
      renderPhotoBox();
      toast('2x2 picture uploaded');
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(f);
}
function removePhoto(){
  delete cur.photo;
  const inp = $('photo_input');
  if(inp) inp.value = '';
  renderPhotoBox();
  toast('Inalis ang 2x2 picture');
}
function renderPhotoBox(){
  const p = $('photo_preview');
  if(!p) return;
  const isRo = typeof RO === 'function' ? RO() : false;
  if(cur && cur.photo){
    p.innerHTML = '<img src="' + cur.photo + '" style="width:100%;height:100%;object-fit:cover">';
  } else {
    p.innerHTML = '<div style="font-size:32px;color:var(--mute)">📷</div><div style="font-size:11px;font-weight:600;color:var(--tx);margin-top:4px">2x2 ID Photo</div><div style="font-size:10px;color:var(--mute)">' + (isRo ? 'No photo' : 'I-click para mag-upload') + '</div>';
  }
  const btnDiv = $('photo_acts');
  if(btnDiv){
    if(isRo){
      btnDiv.innerHTML = (cur && cur.photo) ? '<button type="button" class="b sm s" onclick="viewPhoto(\'' + cur.id + '\')">View photo</button>' : '<span class="mut" style="font-size:11px">Read-only mode</span>';
    } else {
      btnDiv.innerHTML = '<button type="button" class="b sm s" onclick="$(\'photo_input\').click()">' + ((cur && cur.photo) ? 'Palitan' : 'Mag-upload') + '</button>' +
        ((cur && cur.photo) ? ' <button type="button" class="b sm d" onclick="removePhoto()">Alisin</button>' : '');
    }
  }
}
function viewPhoto(id){
  const e = db.emp.find(x => x.id === id);
  if(!e || !e.photo){ toast('Walang naka-upload na 2x2 picture.'); return; }
  const w = window.open('');
  w.document.write('<title>2x2 Photo - ' + esc(fn(e)) + '</title><body style="margin:0;background:#111;display:flex;justify-content:center;align-items:center;min-height:100vh"><img src="' + e.photo + '" style="max-width:90vw;max-height:90vh;border-radius:8px;box-shadow:0 0 24px rgba(0,0,0,0.6)"></body>');
}

/* Password Eye Toggle Helper */
function setupPassToggle(btnId, inputId) {
  const btn = $(btnId), inp = $(inputId);
  if (!btn || !inp) return;
  btn.onclick = () => {
    if (inp.type === 'password') {
      inp.type = 'text';
      btn.textContent = '🙈';
      btn.title = 'Hide password';
    } else {
      inp.type = 'password';
      btn.textContent = '👁️';
      btn.title = 'Show password';
    }
    inp.focus();
  };
}
setupPassToggle('lpToggle', 'lp');
setupPassToggle('lc2Toggle', 'lc2');

/* Remember Password Management */
const EMS_REM_KEY = 'ems_saved_passwords_v1';
function getSavedPasswords() {
  try { return JSON.parse(localStorage.getItem(EMS_REM_KEY) || '{}'); } catch(e) { return {}; }
}
function saveUserPassword(u, p, remember) {
  try {
    const map = getSavedPasswords();
    if (remember && p) map[u.toLowerCase()] = p;
    else delete map[u.toLowerCase()];
    localStorage.setItem(EMS_REM_KEY, JSON.stringify(map));
  } catch(e) {}
}
function checkSavedPass(u) {
  ensureSystemAccounts();
  u = (u || '').toLowerCase().trim();
  const map = getSavedPasswords();
  const pInput = $('lp'), remChk = $('lrem'), forgetBtn = $('lforget');
  if (u && map[u]) {
    pInput.value = map[u];
    if (remChk) remChk.checked = true;
    if (forgetBtn) forgetBtn.style.display = 'inline-block';
  } else {
    pInput.value = '';
    if (remChk) remChk.checked = false;
    if (forgetBtn) forgetBtn.style.display = 'none';
  }
}
if ($('lu')) {
  $('lu').oninput = () => checkSavedPass($('lu').value);
}
if ($('lforget')) {
  $('lforget').onclick = () => {
    const u = $('lu').value.toLowerCase().trim();
    const map = getSavedPasswords();
    delete map[u];
    localStorage.setItem(EMS_REM_KEY, JSON.stringify(map));
    $('lp').value = '';
    $('lrem').checked = false;
    $('lforget').style.display = 'none';
    toast('Saved password forgotten for ' + u);
  };
}
